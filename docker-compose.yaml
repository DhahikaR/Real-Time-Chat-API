services:
  app:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres_data:

    # Build dan jalankan semua service:
    # docker-compose up --build
